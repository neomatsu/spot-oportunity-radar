defaults:
  mode: trade_by_trade
  initial_capital: 100000
  max_open_positions: 6
  allow_overlapping_per_asset: false

execution:
  entry_mode: next_open
  position_size_mode: suggested_weight_add
  fixed_position_pct: 0.03
  commission_bps: 8
  slippage_bps: 5

entry_rules:
  min_final_score: 60
  max_risk_score: 65
  max_distance_to_support_pct: 6
  max_rsi14: 65
  require_bullish_trend: false
  allowed_recommendations:
    - BUY_CANDIDATE
    - WATCH

exit_rules:
  strategy: hybrid
  fixed_horizon_days: 20
  max_holding_days: 40
  take_profit_pct: 0.12
  stop_loss_pct: 0.07
  signal_loss_score_threshold: 45
  invalidation_buffer_pct: 0.01
  position_alert_exit_types:
    - take_profit
    - reduce_risk
    - exit_candidate
    - stop_loss_warning

evaluation:
  train_ratio: 0.7
  min_trades_warning_threshold: 8

portfolio:
  respect_sector_limits: false
  respect_asset_type_limits: false
  max_asset_weight: 0.12
  max_sector_weight: 0.30
  max_asset_type_weight:
    stock: 0.65
    etf: 0.80
    crypto: 0.15

portfolio_simulation:
  cash_min_target_pct: 0.10
  max_asset_weight: 0.12
  max_sector_weight: 0.30
  max_asset_type_weight:
    stock: 0.65
    etf: 0.80
    crypto: 0.15
  apply_portfolio_limits: true
  allow_add_to_existing: true
  use_suggested_weight_add: true
  buy_weight_override_pct: null
  min_trade_value: 250
  min_residual_position_value: 150
  sell_reduction_by_alert_type:
    take_profit: 0.25
    reduce_risk: 0.30
    trim_position: 0.20
    exit_candidate: 1.00
    stop_loss_warning: 1.00
    rebalance_sell: 0.20
    overbought_warning: 0.10
  sell_priority:
    - stop_loss_warning
    - exit_candidate
    - reduce_risk
    - trim_position
    - take_profit
    - rebalance_sell
    - overbought_warning

rsi_cycle_strategy:
  oversold_threshold: 30
  deep_oversold_threshold_1: 25
  deep_oversold_threshold_2: 20
  overbought_threshold: 70
  overbought_threshold_1: 75
  overbought_threshold_2: 80
  buy_pct_bullish_divergence: 0.35
  buy_pct_rsi_25: 0.25
  buy_pct_rsi_20: 0.40
  sell_pct_bearish_divergence: 0.35
  sell_pct_rsi_75: 0.25
  sell_pct_rsi_80: 0.40
  min_bars_between_pivots: 3
  max_bars_between_pivots: 20
  pivot_price_source: close
  require_confirmation_cross: true
  max_one_divergence_per_cycle: true
