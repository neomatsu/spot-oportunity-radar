[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spot-opportunity-radar"
version = "0.1.0"
description = "Personal investment radar for spot opportunities across equities, ETFs and crypto."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "APScheduler>=3.10,<4.0",
  "httpx>=0.27,<0.29",
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<3.0",
  "plotly>=5.24,<6.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "python-dotenv>=1.0,<2.0",
  "PyYAML>=6.0,<7.0",
  "scikit-learn>=1.8,<2.0",
  "scipy>=1.17,<2.0",
  "SQLAlchemy>=2.0,<3.0",
  "streamlit>=1.39,<2.0",
  "yfinance>=0.2.54,<0.3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "ruff>=0.6,<0.8",
]

[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["B008", "E402", "N999"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
